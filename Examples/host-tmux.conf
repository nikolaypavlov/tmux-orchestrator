# Tmux Orchestrator - Recommended Host Configuration
# Copy this to ~/.tmux.conf or ~/.config/tmux/tmux.conf

# ===== Essential Settings for Tmux Orchestrator =====

# Enable mouse support (easier window/pane selection)
set -g mouse on

# Increase scrollback buffer (capture more agent output)
set -g history-limit 10000

# Set base index to 1 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# ===== Plugin Manager (TPM) =====

# TPM itself
set -g @plugin 'tmux-plugins/tpm'

# ===== Session Persistence (CRITICAL for 24/7 operation) =====

# tmux-resurrect: Save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Auto-save every 5 minutes (highly recommended!)
set -g @resurrect-save-interval '5'

# Restore vim/nvim sessions (if you use them)
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Capture pane contents for better restoration
set -g @resurrect-capture-pane-contents 'on'

# ===== Optional: tmux-continuum for automatic restore =====

# Automatically restore last saved session on tmux start
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'
# set -g @continuum-save-interval '5'

# ===== Visual Improvements =====

# Better status bar
set -g status-style bg=colour234,fg=colour137
set -g status-left '#[fg=colour233,bg=colour245,bold] #S '
set -g status-right '#[fg=colour233,bg=colour241,bold] %Y-%m-%d #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

# Active window highlighting
setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

# Inactive window styling
setw -g window-status-style fg=colour138,bg=colour235
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# Pane border colors
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour81

# ===== Better Key Bindings =====

# Reload configuration
bind r source-file ~/.tmux.conf \; display "Configuration reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Easy pane navigation (Vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ===== Copy Mode Improvements =====

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Better copy-paste (macOS)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# Better copy-paste (Linux)
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
# bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# ===== Performance =====

# Reduce escape time (better for vim users)
set -sg escape-time 0

# Refresh status bar every second
set -g status-interval 1

# Enable focus events (for better vim/editor integration)
set -g focus-events on

# ===== Terminal Improvements =====

# Enable true color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ===== Initialize TPM (MUST BE AT BOTTOM) =====

# Standard location:
run '~/.tmux/plugins/tpm/tpm'

# Or XDG location (uncomment if using XDG):
# run '~/.config/tmux/plugins/tpm/tpm'

# ===== Manual Save/Restore Keybindings =====
#
# Ctrl-b Ctrl-s - Save session
# Ctrl-b Ctrl-r - Restore session
#
# With auto-save enabled, sessions are saved every 5 minutes automatically.
