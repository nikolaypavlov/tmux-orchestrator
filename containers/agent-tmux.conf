# Tmux configuration for Claude agents in containers
# Basic configuration without tmux-resurrect (host uses that)

# Set prefix to Ctrl-b (default, but explicit)
set -g prefix C-b

# Enable mouse support
set -g mouse on

# Set scrollback buffer size
set -g history-limit 50000

# Start window numbering at 1
set -g base-index 1
set -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable 256 color support
set -g default-terminal "screen-256color"

# Set escape time to 0 for better vim experience
set -sg escape-time 0

# Enable focus events for better editor integration
set -g focus-events on

# Status bar configuration
set -g status-style bg=black,fg=white
set -g status-left "[#{session_name}] "
set -g status-right "%H:%M %d-%b-%y"
set -g status-left-length 30
set -g status-right-length 40

# Window status format
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W* "
setw -g window-status-current-style bg=blue,fg=white

# Pane border colors
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=blue

# Message style
set -g message-style bg=yellow,fg=black

# Copy mode vi-style keybindings
setw -g mode-keys vi

# Easier pane splitting
bind | split-window -h
bind - split-window -v

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload configuration
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
